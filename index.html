  let helpOpen = false;
  let lastFocusBeforeHelp = null;

  function renderHelpContent() {
    document.getElementById('help-body').innerHTML = helpContent[lang] || helpContent.es;
    document.getElementById('help-title').textContent = lang === 'es' ? 'Ayuda' : 'Help';
    document.getElementById('btn-help-close').setAttribute('aria-label', lang === 'es' ? 'Cerrar ayuda' : 'Close help');
  }

  function toggleHelp() {
    helpOpen = !helpOpen;
    const overlay = document.getElementById('help-overlay');
    document.getElementById('btn-help').setAttribute('aria-pressed', String(helpOpen));
    if (helpOpen) {
      renderHelpContent();
      overlay.classList.add('show');
      lastFocusBeforeHelp = document.activeElement;
      setTimeout(() => document.getElementById('btn-help-close').focus(), 50);
    } else {
      overlay.classList.remove('show');
      if (lastFocusBeforeHelp) { lastFocusBeforeHelp.focus(); lastFocusBeforeHelp = null; }
    }
  }

  document.getElementById('help-panel').addEventListener('keydown', e => {
    if (!helpOpen) return;
    if (e.code === 'Escape') { e.preventDefault(); toggleHelp(); return; }
    if (e.code === 'Tab') {
      const panel = document.getElementById('help-panel');
      const focusables = Array.from(panel.querySelectorAll('button, a, [tabindex]:not([tabindex="-1"])'))
        .filter(el => !el.disabled && el.offsetParent !== null);
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }, true);

  // ── Render ─────────────────────────────────────────────
  // ── Selector de sesiones ───────────────────────────────
  function renderSessionSwitcher() {
    const sel = document.getElementById('session-switcher');
    sel.setAttribute('aria-label', t('sess-switcher-label'));
    sel.innerHTML = '';
    if (sessionsData.length < 1) { sel.style.display = 'none'; return; }
    sessionsData.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.name || (lang === 'es' ? 'Sin nombre' : 'Untitled');
      if (s.id === activeSessionId) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.style.display = '';
  }

  function switchSession(id) {
    if (!id || id === activeSessionId) return;
    activeSessionId = id;
    activeSpeakerIdx = null;
    saveSessions();
    renderSessionsPanel();
  }

  function renderSessionsPanel() {
    const sess = getActiveSession();

    renderSessionSwitcher();

    // Session name input
    const nameInput = document.getElementById('input-session-name');
    nameInput.value = sess ? sess.name : '';

    const list = document.getElementById('sessions-list');
    list.innerHTML = '';

    if (!sess || !sess.speakers || sess.speakers.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'padding:1.5rem 1.2rem;font-size:0.7rem;color:var(--mid);text-align:center;opacity:0.6;font-style:italic;';
      empty.textContent = t('sess-no-speakers');
      list.appendChild(empty);
    } else {
      // Group label
      const lbl = document.createElement('div');
      lbl.className = 'sessions-group-label';
      lbl.textContent = sess.name || (lang === 'es' ? 'Ponentes' : 'Speakers');
      list.appendChild(lbl);

      sess.speakers.forEach((sp, idx) => {
        const card = document.createElement('div');
        card.className = 'speaker-card' + (idx === activeSpeakerIdx ? ' active' : '');
        card.dataset.idx = idx;
        card.title = t('sess-load-tip');
        card.setAttribute('draggable', true);

        card.innerHTML = `
          <span class="drag-handle" title="Arrastrar">⠿</span>
          <span class="speaker-index">${idx+1}</span>
          <div class="speaker-info">
            <div class="speaker-name">${escHtml(sp.name || '—')}</div>
            ${sp.title ? `<div class="speaker-title">${escHtml(sp.title)}</div>` : ''}
          </div>
          <span class="speaker-duration">${fmtDur(sp.min||0, sp.sec||0)}</span>
          <button class="speaker-del" onclick="deleteSpeaker(${idx},event)" title="${lang==='es'?'Eliminar':'Delete'}">✕</button>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.classList.contains('speaker-del') || e.target.closest('.speaker-del')) return;
          loadSpeakerTime(idx);
        });

        // Drag & drop reorder
        card.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/plain', idx);
          card.classList.add('dragging');
        });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
        card.addEventListener('dragover', e => {
          e.preventDefault();
          card.classList.add('drag-over');
        });
        card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
        card.addEventListener('drop', e => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
          const toIdx = parseInt(card.dataset.idx);
          if (fromIdx === toIdx) return;
          const arr = sess.speakers;
          const [moved] = arr.splice(fromIdx, 1);
          arr.splice(toIdx, 0, moved);
          if (activeSpeakerIdx === fromIdx) activeSpeakerIdx = toIdx;
          else if (activeSpeakerIdx > fromIdx && activeSpeakerIdx <= toIdx) activeSpeakerIdx--;
          else if (activeSpeakerIdx < fromIdx && activeSpeakerIdx >= toIdx) activeSpeakerIdx++;
          saveSessions();
          renderSessionsPanel();
        });

        list.appendChild(card);
      });
    }

    // Total
    document.getElementById('total-time-display').textContent =
      sess ? totalDuration(sess.speakers) : '00:00';
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Load speaker time into timer ───────────────────────
  function loadSpeakerTime(idx) {
    const sess = getActiveSession();
    if (!sess) return;
    const sp = sess.speakers[idx];
    if (!sp) return;

    activeSpeakerIdx = idx;

    // Load into timer inputs
    inputMin.value = sp.min || 0;
    inputSec.value = sp.sec || 0;

    // Reset timer with new time
    if (!running) resetTimer();

    renderSessionsPanel();
  }

  // ── Session CRUD ───────────────────────────────────────
  function newSession() {
    const sess = {
      id: uid(),
      name: lang === 'es' ? 'Nueva sesión' : 'New session',
      speakers: []
    };
    sessionsData.push(sess);
    activeSessionId = sess.id;
    activeSpeakerIdx = null;
    saveSessions();
    renderSessionsPanel();
    setTimeout(() => {
      const ni = document.getElementById('input-session-name');
      ni.focus(); ni.select();
    }, 50);
  }

  function saveSession() {
    const sess = getActiveSession();
    const name = document.getElementById('input-session-name').value.trim();
    if (!sess) { newSession(); return; }
    if (name) sess.name = name;
    saveSessions();
    renderSessionsPanel();
  }

  function duplicateCurrentSession() {
    const sess = getActiveSession();
    if (!sess) return;
    const copy = {
      id: uid(),
      name: (sess.name || (lang === 'es' ? 'Sesión' : 'Session')) + (lang === 'es' ? ' (copia)' : ' (copy)'),
      speakers: (sess.speakers || []).map(sp => ({ ...sp, id: uid() })),
    };
    const idx = sessionsData.findIndex(s => s.id === activeSessionId);
    sessionsData.splice(idx + 1, 0, copy);
    activeSessionId = copy.id;
    activeSpeakerIdx = null;
    saveSessions();
    renderSessionsPanel();
    setTimeout(() => {
      const ni = document.getElementById('input-session-name');
      ni.focus(); ni.select();
    }, 50);
  }

  function deleteCurrentSession() {
    const sess = getActiveSession();
    if (!sess) return;
    const label = lang === 'es'
      ? `¿Eliminar la sesión "${sess.name}"?`
      : `Delete session "${sess.name}"?`;
    if (!confirm(label)) return;
    const removedSession = sess;
    const removedIndex = sessionsData.findIndex(s => s.id === activeSessionId);
    sessionsData = sessionsData.filter(s => s.id !== activeSessionId);
    activeSessionId = sessionsData.length ? sessionsData[0].id : null;
    activeSpeakerIdx = null;
    saveSessions();
    renderSessionsPanel();

    showUndoToast(
      lang === 'es' ? `Sesión "${removedSession.name}" eliminada` : `Session "${removedSession.name}" deleted`,
      () => {
        sessionsData.splice(Math.min(removedIndex, sessionsData.length), 0, removedSession);
        activeSessionId = removedSession.id;
        activeSpeakerIdx = null;
        saveSessions();
        renderSessionsPanel();
      }
    );
  }

  // ── Speaker CRUD ───────────────────────────────────────
  function addSpeaker() {
    let sess = getActiveSession();
    if (!sess) {
      // Auto-create session
      sess = { id: uid(), name: lang === 'es' ? 'Sesión 1' : 'Session 1', speakers: [] };
      sessionsData.push(sess);
      activeSessionId = sess.id;
    }

    const name  = document.getElementById('new-speaker-name').value.trim();
    const title = document.getElementById('new-speaker-title').value.trim();
    const min   = parseInt(document.getElementById('new-speaker-min').value) || 0;
    const sec   = parseInt(document.getElementById('new-speaker-sec').value) || 0;

    if (!name && !title && min === 0 && sec === 0) return;

    sess.speakers.push({ id: uid(), name, title, min, sec });
    saveSessions();

    // Clear form (keep duration as last convenience)
    document.getElementById('new-speaker-name').value = '';
    document.getElementById('new-speaker-title').value = '';

    renderSessionsPanel();
    // Scroll to bottom
    const wrap = document.getElementById('sessions-list-wrap');
    wrap.scrollTop = wrap.scrollHeight;
  }

  function deleteSpeaker(idx, e) {
    e.stopPropagation();
    const sess = getActiveSession();
    if (!sess) return;
    const removed = sess.speakers[idx];
    const removedSessionId = sess.id;
    sess.speakers.splice(idx, 1);
    if (activeSpeakerIdx === idx) activeSpeakerIdx = null;
    else if (activeSpeakerIdx > idx) activeSpeakerIdx--;
    saveSessions();
    renderSessionsPanel();

    showUndoToast(
      lang === 'es'
        ? `Ponente "${removed.name || '(sin nombre)'}" eliminado`
        : `Speaker "${removed.name || '(untitled)'}" removed`,
      () => {
        const s = sessionsData.find(x => x.id === removedSessionId);
        if (!s) return;
        s.speakers.splice(Math.min(idx, s.speakers.length), 0, removed);
        saveSessions();
        renderSessionsPanel();
      }
    );
  }

  // ── TOAST DESHACER ──────────────────────────────────────
  let pendingUndo = null;
  let undoTimer = null;

  function showUndoToast(message, undoFn) {
    clearTimeout(undoTimer);
    pendingUndo = undoFn;
    document.getElementById('undo-toast-msg').textContent = message;
    document.getElementById('undo-toast-btn').textContent = t('undo');
    document.getElementById('undo-toast').classList.add('show');
    undoTimer = setTimeout(hideUndoToast, 5000);
  }

  function hideUndoToast() {
    document.getElementById('undo-toast').classList.remove('show');
    pendingUndo = null;
    clearTimeout(undoTimer);
  }

  function performUndo() {
    if (pendingUndo) pendingUndo();
    hideUndoToast();
  }

  // ── Import / Export ────────────────────────────────────
  function exportSession() {
    const sess = getActiveSession();
    if (!sess) return;
    const blob = new Blob([JSON.stringify(sess, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (sess.name || 'sesion').replace(/[^a-z0-9]/gi,'_') + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportAllSessions() {
    if (!sessionsData.length) return;
    const backup = {
      type: 'tatimer_backup',
      version: 1,
      exportedAt: new Date().toISOString(),
      sessions: sessionsData,
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const stamp = new Date().toISOString().slice(0, 10);
    a.download = `tatimer_backup_${stamp}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function triggerImport() {
    document.getElementById('import-file-input').click();
  }

  function importSession(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);

        // Detecta el formato: backup completo, array de sesiones "a pelo",
        // array plano de ponentes (legacy), o una sola sesión.
        let importedSessions;
        if (data && data.type === 'tatimer_backup' && Array.isArray(data.sessions)) {
          importedSessions = data.sessions;
        } else if (Array.isArray(data) && data.length && data[0] && Array.isArray(data[0].speakers)) {
          importedSessions = data;
        } else if (Array.isArray(data)) {
          importedSessions = [{ name: file.name.replace('.json', ''), speakers: data }];
        } else {
          importedSessions = [data];
        }
        if (!importedSessions.length) throw new Error('empty');

        const newIds = [];
        importedSessions.forEach(s => {
          const newId = uid();
          sessionsData.push({
            id: newId,
            name: s.name || (lang === 'es' ? 'Sesión importada' : 'Imported session'),
            speakers: Array.isArray(s.speakers) ? s.speakers.map(sp => ({ ...sp, id: uid() })) : [],
          });
          newIds.push(newId);
        });

        activeSessionId = newIds[0];
        activeSpeakerIdx = null;
        saveSessions();
        renderSessionsPanel();
      } catch(err) {
        alert(lang === 'es' ? 'Error al importar el archivo JSON.' : 'Error importing JSON file.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  // ── Keyboard shortcut: P = toggle panel ───────────────
  // (added to the existing keydown listener below)

  // ── i18n for sessions panel ───────────────────────────
  function updateSessionsI18n(l) {
    document.getElementById('sessions-title').textContent = i18n[l]['sess-panel-title'];
    document.getElementById('btn-sessions-label').textContent = i18n[l]['sess-btn-sessions-label'];
    document.getElementById('btn-sessions').title = i18n[l]['sess-btn-sessions-label'];
    document.getElementById('btn-sessions').setAttribute('aria-label', i18n[l]['sess-btn-sessions-label']);
    document.getElementById('input-session-name').placeholder = i18n[l]['sess-session-placeholder'];
    document.querySelector('[data-i18n-sess="btn-save"]').textContent    = i18n[l]['sess-btn-save'];
    document.querySelector('[data-i18n-sess="btn-duplicate"]').textContent = i18n[l]['sess-btn-duplicate'];
    document.querySelector('[data-i18n-sess="btn-new"]').textContent     = i18n[l]['sess-btn-new'];
    document.querySelector('[data-i18n-sess="btn-delete-sess"]').textContent = i18n[l]['sess-btn-delete-sess'];
    document.getElementById('add-speaker-form-title').textContent        = i18n[l]['sess-form-title'];
    document.getElementById('new-speaker-name').placeholder  = i18n[l]['sess-ph-speaker'];
    document.getElementById('new-speaker-title').placeholder = i18n[l]['sess-ph-title'];
    document.querySelector('[data-i18n-sess="min-sec-label"]').textContent = i18n[l]['sess-min-sec-label'];
    document.getElementById('btn-add-speaker').textContent   = i18n[l]['sess-btn-add'];
    document.querySelector('[data-i18n-sess="total-label"]').textContent = i18n[l]['sess-total-label'];
    document.querySelector('[data-i18n-sess="btn-export"]').textContent  = i18n[l]['sess-btn-export'];
    document.querySelector('[data-i18n-sess="btn-import"]').textContent  = i18n[l]['sess-btn-import'];
    document.querySelector('[data-i18n-sess="btn-export-all"]').textContent = i18n[l]['sess-btn-export-all'];
    document.getElementById('btn-publicar').textContent = i18n[l]['sess-btn-publicar'];
    renderSessionSwitcher();
    if (sessionsPanelOpen) renderSessionsPanel();
  }

  // Hook into setLang
  const _origSetLang = setLang;
  setLang = function(l) {
    _origSetLang(l);
    updateSessionsI18n(l);
  };

  // Add-speaker form: Enter key support
  ['new-speaker-name','new-speaker-title','new-speaker-min','new-speaker-sec'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.code === 'Enter') { e.preventDefault(); addSpeaker(); }
      e.stopPropagation();
    });
  });

  document.getElementById('input-session-name').addEventListener('keydown', e => {
    if (e.code === 'Enter') { e.preventDefault(); saveSession(); }
    e.stopPropagation();
  });

  // ── VISTAS ESCENARIO / AUDIENCE ───────────────────────
  // Comunicación via localStorage + storage event
  // (funciona en file:// y en cualquier servidor)

  const LS_TIMER    = 'tatimer_bc_timer';
  const LS_AUDIENCE = 'tatimer_bc_audience';
  const LS_MESSAGE  = 'tatimer_bc_message';
  const LS_PRESENCE_ESC = 'tatimer_bc_presence_escenario';
  const LS_PRESENCE_AUD = 'tatimer_bc_presence_audience';
  let lastSeenEsc = 0, lastSeenAud = 0;

  let escenarioWin = null;
  let audienceWin  = null;
  let escenarioClock = false;

  function toggleEscenarioClock() {
    escenarioClock = !escenarioClock;
    const btnEC = document.getElementById('btn-escenario-clock');
    btnEC.classList.toggle('active', escenarioClock);
    btnEC.setAttribute('aria-pressed', String(escenarioClock));
    broadcastTimerState();
  }

  function broadcastTimerState() {
    const isCountdownLike = mode === 'countdown' || mode === 'untiltime';
    const remaining = isCountdownLike ? totalSeconds - elapsed : elapsed;
    const pct       = isCountdownLike ? Math.max(0, (remaining / totalSeconds) * 100) : 100;
    const { warningSeconds, dangerSeconds } = getAlertSeconds();
    let state = 'normal';
    if (isCountdownLike) {
      if (remaining < 0)                    state = 'overtime';
      else if (remaining <= dangerSeconds)  state = 'danger';
      else if (remaining <= warningSeconds) state = 'warning';
    }
    localStorage.setItem(LS_TIMER, JSON.stringify({
      type: 'timer', mode, running, elapsed, totalSeconds, remaining, pct, state,
      display: display.textContent, theme: currentTheme, lang,
      showClock: escenarioClock,
      alertsEnabled,
      warningPct: alertsEnabled && totalSeconds > 0 ? Math.min(100, ((parseInt(document.getElementById('input-warning').value)||3)*60 / totalSeconds)*100) : 0,
      dangerPct:  alertsEnabled && totalSeconds > 0 ? Math.min(100, ((parseInt(document.getElementById('input-danger').value)||1)*60  / totalSeconds)*100) : 0,
      ts: Date.now(),
    }));
  }

  function publishToAudience() {
    const sess = getActiveSession();
    const sp   = sess && activeSpeakerIdx !== null ? sess.speakers[activeSpeakerIdx] : null;
    localStorage.setItem(LS_AUDIENCE, JSON.stringify({
      type: 'speaker',
      name:    sp ? sp.name  : '',
      title:   sp ? sp.title : '',
      min:     sp ? sp.min   : 0,
      sec:     sp ? sp.sec   : 0,
      session: sess ? sess.name : '',
      theme:   currentTheme,
      ts: Date.now(),
    }));
    const btn = document.getElementById('btn-publicar');
    btn.style.color = '#22c55e';
    btn.style.borderColor = 'rgba(34,197,94,0.4)';
    setTimeout(() => { btn.style.color = ''; btn.style.borderColor = ''; }, 800);
  }

  // Abre o enfoca una vista usando ?view= en la misma URL
  function openView(type) {
    const url = window.location.pathname + '?view=' + type;

    if (type === 'escenario') {
      if (escenarioWin && !escenarioWin.closed) { escenarioWin.focus(); return; }
      escenarioWin = window.open(url, 'tatimer_escenario', 'width=1280,height=720');
      const poll = setInterval(() => {
        if (escenarioWin && escenarioWin.closed) { clearInterval(poll); escenarioWin = null; }
      }, 1000);
    } else {
      if (audienceWin && !audienceWin.closed) { audienceWin.focus(); return; }
      audienceWin = window.open(url, 'tatimer_audience', 'width=1280,height=720');
      const poll = setInterval(() => {
        if (audienceWin && audienceWin.closed) { clearInterval(poll); audienceWin = null; }
      }, 1000);
    }
  }

  // ── INDICADOR DE VENTANAS CONECTADAS ──────────────────
  // Se basa en el heartbeat por localStorage que emiten las vistas
  // Escenario/Audience, no en la referencia window.open() — así funciona
  // aunque el operador recargue la página o la ventana se abriera por URL.
  function updateLiveIndicators() {
    const now = Date.now();
    const escLive = (now - lastSeenEsc) < 4000;
    const audLive = (now - lastSeenAud) < 4000;
    document.getElementById('btn-view-escenario').classList.toggle('live', escLive);
    document.getElementById('btn-view-audience').classList.toggle('live', audLive);
  }

  window.addEventListener('storage', e => {
    if (e.key === LS_PRESENCE_ESC) { lastSeenEsc = e.newValue ? (JSON.parse(e.newValue).ts || 0) : 0; updateLiveIndicators(); }
    if (e.key === LS_PRESENCE_AUD) { lastSeenAud = e.newValue ? (JSON.parse(e.newValue).ts || 0) : 0; updateLiveIndicators(); }
  });

  // Semilla inicial por si las ventanas ya estaban abiertas al cargar/recargar el operador
  try { const r = localStorage.getItem(LS_PRESENCE_ESC); if (r) lastSeenEsc = JSON.parse(r).ts || 0; } catch(_){}
  try { const r = localStorage.getItem(LS_PRESENCE_AUD); if (r) lastSeenAud = JSON.parse(r).ts || 0; } catch(_){}
  updateLiveIndicators();
  setInterval(updateLiveIndicators, 1000);

  // Engancha al loop del timer para emitir estado continuo
  const _origUpdateDisplay = updateDisplay;
  updateDisplay = function() {
    _origUpdateDisplay();
    broadcastTimerState();
  };

  // Emite también en modo reloj
  const _origStartClock = startClock;
  startClock = function() {
    _origStartClock();
    clearInterval(window._clockBroadcast);
    window._clockBroadcast = setInterval(broadcastTimerState, 500);
  };
  const _origStopClock = stopClock;
  stopClock = function() {
    _origStopClock();
    clearInterval(window._clockBroadcast);
  };

  // ── INIT sessions ──────────────────────────────────────
  loadSessions();

  // ── INIT ──────────────────────────────────────────────
  setLang('es');
  updateSessionsI18n('es');
  resetTimer();
  handleURLParams();

  inputMin.addEventListener('input', () => { if (!running) resetTimer(); });
  inputSec.addEventListener('input', () => { if (!running) resetTimer(); });
  document.getElementById('input-target-time').addEventListener('input', () => { if (!running) resetTimer(); });

  document.getElementById('input-warning').addEventListener('input', () => { updateSegments(); });
  document.getElementById('input-danger').addEventListener('input',  () => { updateSegments(); });

  // ── WAKE LOCK ──────────────────────────────────────────
  // Evita que el sistema apague la pantalla o active el salvapantallas
  // mientras el timer está a la vista (escenario/operador pueden estar horas activos).
  let wakeLock = null;

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (err) {
      // Puede fallar si la pestaña no está visible o el navegador lo restringe; no es crítico.
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (wakeLock === null && document.visibilityState === 'visible') requestWakeLock();
  });

  requestWakeLock();

  // ── SERVICE WORKER ─────────────────────────────────────
  // Solo en contextos seguros (https o localhost); en file:// o content://
  // (pruebas locales en Android) no está disponible y se ignora en silencio.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
